name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # pandas 3.x exige Python >= 3.11
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Os testes que dependem dos CSVs do desafio (pagamentos/, não versionado) são pulados.
      - run: python -m pytest -q
